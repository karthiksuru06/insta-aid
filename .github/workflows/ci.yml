name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  app:
    name: App checks (typecheck, test, audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci || npm install
      - name: Typecheck
        run: npm run typecheck
      - name: Unit & integration tests
        run: npm test
      - name: Dependency audit (report-only)
        # Non-blocking: transitive RN/Expo deps often carry advisories that
        # can't be fixed downstream. Surfaced in logs without failing the build.
        run: npm audit --audit-level=high || true

  functions:
    name: Cloud Functions build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./functions
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Build (tsc)
        run: npm run build --if-present
