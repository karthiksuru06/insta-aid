services:
  - type: web
    name: instaaid-backend
    env: node
    plan: free
    buildCommand: npm install
    startCommand: node server.mjs
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT
        sync: false
      # Set to your real frontend origin(s), comma-separated. Do NOT use "*".
      - key: CORS_ORIGIN
        sync: false
      # Bootstrap admin email(s); leave unset once custom claims are configured.
      - key: ADMIN_EMAILS
        sync: false